[project]
name = "paisa-vasool-api-gateway"
version = "0.1.0"
description = "API Gateway for Paisa Vasool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.41.0",
    "pydantic-settings>=2.13.1",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"src/api/rest/routes/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    "types-python-jose>=3.5.0.20250531",
    "types-redis>=4.6.0.20241004",
]
